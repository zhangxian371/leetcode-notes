<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeetCode Hot 100 学习笔记</title><style>:root{--bg:#f6f7fb;--panel:#fff;--text:#20242c;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--soft:#eef2ff;--ok:#eaf7ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.side{background:#171923;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:800}.sub,.progress{font-size:13px;color:#aeb4c0;margin:6px 0 16px}.search{width:100%;border:0;border-radius:10px;padding:10px 12px;background:#282c39;color:#fff}.group{font-size:12px;color:#8f96a3;margin:18px 8px 7px}.nav{display:flex;width:100%;gap:7px;align-items:center;text-align:left;border:0;background:transparent;color:#d9dde5;padding:8px 9px;border-radius:8px;cursor:pointer}.nav:hover,.nav.active{background:#303546}.dot{width:7px;height:7px;border-radius:50%;background:#555c6d}.done .dot{background:#55b879}.diff{margin-left:auto;font-size:11px;color:#8f96a3}.main{padding:34px;max-width:1050px;width:100%;margin:auto}.hero h1{margin:0;font-size:31px}.hero p{color:var(--muted);line-height:1.7}.card{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px}.title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.tag{font-size:12px;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--accent)}h2{margin:0}h3{font-size:15px;margin:24px 0 8px}.problem{background:#f8f9fc;border:1px solid var(--line);padding:15px 16px;border-radius:10px;line-height:1.85}.note{background:#fafafa;border-left:4px solid #c7cad1;padding:12px 14px;border-radius:7px;line-height:1.8}.key{background:var(--ok);border-left-color:#42a66b}.empty{color:var(--muted);line-height:1.8}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:45vh;position:relative}.main{padding:20px}}</style></head><body><div class="app"><aside class="side"><div class="brand">LeetCode Hot 100</div><div class="sub">我的 100 题学习笔记</div><input id="search" class="search" placeholder="搜索题目 / 分类…"><div id="progress" class="progress"></div><div id="nav"></div></aside><main class="main"><div class="hero"><h1>LeetCode Hot 100 学习笔记</h1><p>目录固定为 Hot 100。每题先看题意，再记录「我的第一反应 → 卡在哪里 → 核心思想 → 为什么正确」。</p></div><div id="content"></div></main></div><script>
const G={"哈希":[["两数之和","简单"],["字母异位词分组","中等"],["最长连续序列","中等"]],"双指针":[["移动零","简单"],["盛最多水的容器","中等"],["三数之和","中等"],["接雨水","困难"]],"滑动窗口":[["无重复字符的最长子串","中等"],["找到字符串中所有字母异位词","中等"]],"子串":[["和为 K 的子数组","中等"],["滑动窗口最大值","困难"],["最小覆盖子串","困难"]],"普通数组":[["最大子数组和","中等"],["合并区间","中等"],["轮转数组","中等"],["除了自身以外数组的乘积","中等"],["缺失的第一个正数","困难"]],"矩阵":[["矩阵置零","中等"],["螺旋矩阵","中等"],["旋转图像","中等"],["搜索二维矩阵 II","中等"]],"链表":[["相交链表","简单"],["反转链表","简单"],["回文链表","简单"],["环形链表","简单"],["环形链表 II","中等"],["合并两个有序链表","简单"],["两数相加","中等"],["删除链表的倒数第 N 个结点","中等"],["两两交换链表中的节点","中等"],["K 个一组翻转链表","困难"],["随机链表的复制","中等"],["排序链表","中等"],["合并 K 个升序链表","困难"],["LRU 缓存","中等"]],"二叉树":[["二叉树的中序遍历","简单"],["二叉树的最大深度","简单"],["翻转二叉树","简单"],["对称二叉树","简单"],["二叉树的直径","简单"],["二叉树的层序遍历","中等"],["将有序数组转换为二叉搜索树","简单"],["验证二叉搜索树","中等"],["二叉搜索树中第 K 小的元素","中等"],["二叉树的右视图","中等"],["二叉树展开为链表","中等"],["从前序与中序遍历序列构造二叉树","中等"],["路径总和 III","中等"],["二叉树的最近公共祖先","中等"],["二叉树中的最大路径和","困难"]],"图论":[["岛屿数量","中等"],["腐烂的橘子","中等"],["课程表","中等"],["实现 Trie (前缀树)","中等"]],"回溯":[["全排列","中等"],["子集","中等"],["电话号码的字母组合","中等"],["组合总和","中等"],["括号生成","中等"],["单词搜索","中等"],["分割回文串","中等"],["N 皇后","困难"]],"二分查找":[["搜索插入位置","简单"],["搜索二维矩阵","中等"],["在排序数组中查找元素的第一个和最后一个位置","中等"],["搜索旋转排序数组","中等"],["寻找旋转排序数组中的最小值","中等"],["寻找两个正序数组的中位数","困难"]],"栈":[["有效的括号","简单"],["最小栈","中等"],["字符串解码","中等"],["每日温度","中等"],["柱状图中最大的矩形","困难"]],"堆":[["数组中的第K个最大元素","中等"],["前 K 个高频元素","中等"],["数据流的中位数","困难"]],"贪心算法":[["买卖股票的最佳时机","简单"],["跳跃游戏","中等"],["跳跃游戏 II","中等"],["划分字母区间","中等"]],"动态规划":[["爬楼梯","简单"],["杨辉三角","简单"],["打家劫舍","中等"],["完全平方数","中等"],["零钱兑换","中等"],["单词拆分","中等"],["最长递增子序列","中等"],["乘积最大子数组","中等"],["分割等和子集","中等"],["最长有效括号","困难"]],"多维动态规划":[["不同路径","中等"],["最小路径和","中等"],["最长回文子串","中等"],["最长公共子序列","中等"],["编辑距离","中等"]],"技巧":[["只出现一次的数字","简单"],["多数元素","简单"],["颜色分类","中等"],["下一个排列","中等"],["寻找重复数","中等"]]};
const P={"移动零":"给定一个整数数组，把所有 0 移到数组末尾，同时保持非零元素原有的相对顺序；要求原地修改数组。","字母异位词分组":"给定一组字符串，把由相同字母以不同顺序组成的字符串归到同一组，分组结果顺序不限。","最长连续序列":"给定一个未排序整数数组，找出数字连续的最长序列长度；目标是做到 O(n) 时间复杂度。","盛最多水的容器":"给定一组竖线高度，选择其中两条与 x 轴构成容器，求能够盛水的最大面积。","三数之和":"给定整数数组，找出所有和为 0 且互不重复的三元组。","接雨水":"给定一组非负整数表示柱子高度，计算下雨后这些柱子之间总共能接住多少水。","找到字符串中所有字母异位词":"给定字符串 s 和 p，找出 s 中所有长度与 p 相同、且字符组成与 p 相同的子串起始下标。","和为 K 的子数组":"给定整数数组 nums 和整数 k，统计数组中元素和恰好等于 k 的连续子数组数量。","滑动窗口最大值":"给定整数数组和窗口大小 k，窗口从左向右每次移动一格，返回每个窗口中的最大值。","最小覆盖子串":"给定字符串 s 和 t，在 s 中寻找能够覆盖 t 中全部字符及其出现次数的最短连续子串；不存在则返回空串。","最大子数组和":"给定整数数组，找出至少包含一个元素的连续子数组，使其元素之和最大，并返回这个最大和。","搜索二维矩阵 II":"给定一个每行从左到右递增、每列从上到下递增的矩阵，判断目标值是否存在于矩阵中。"};
const N={"移动零":["双指针推进，把非零元素向前集中。","维护一个位置，表示下一个非零元素应该放在哪里。","一个指针扫描，一个指针维护有效区间边界，O(n)/O(1)。"],"字母异位词分组":["最初考虑排序、两两比较，后来转向哈希表。","为字符串计算统一 key，再做 key → 字符串组。","不要问它和谁一样，而是直接计算它属于哪个桶。"],"最长连续序列":["关注怎样做到 O(n)。","只从 x-1 不存在的起点开始向后扩展。","避免从每个数字重复扩展。"],"盛最多水的容器":["从暴力进入双指针，重点追问为什么移动短边。","面积受短边限制，所以移动短边。","不是保证下一步更优，而是证明能排除不可能成为最优解的组合。"],"三数之和":["先想排序后二分，后来改成固定一个数加左右双指针。","固定 nums[i]，在右侧找两数之和等于 -nums[i]。","排序提供单调性，同时注意三层去重。"],"接雨水":["先理解逐列计算，再理解双指针。","水量由左右最高墙较矮者决定。","哪侧最高墙更低，哪侧当前水量就已经可以确定。"],"找到字符串中所有字母异位词":["用两个频次表维护目标和窗口。","固定长度滑动窗口：右进一个、左出一个。","字符集已知时固定数组比哈希表更直接。"],"和为 K 的子数组":["一开始感觉像滑动窗口，随后转向前缀和。","当前前缀和 sum 时，历史 sum-k 的出现次数就是新增答案数。","负数破坏窗口和的单调性，所以普通滑动窗口不适用。"],"滑动窗口最大值":["重点理解为什么需要单调队列。","队列保存仍可能成为最大值的下标，并保持值递减。","新元素比旧元素更大且更新时，旧的小元素可以永久淘汰。"],"最小覆盖子串":["概括成像蚯蚓移动：右边扩张，满足后缩左边。","右扩到满足，左边在仍满足时尽可能收缩。","每个字符至多进出窗口一次。"],"最大子数组和":["最难的是为什么按“以当前位置结束”划分。","cur=必须以 i 结尾的最大和：max(nums[i],cur+nums[i])。","这是人为设计的 DP 状态，使当前只依赖前一步；负历史贡献应丢弃。"],"搜索二维矩阵 II":["从右上角出发，按大小向左或向下。","右上角向左变小、向下变大。","每一步排除一行或一列，O(m+n)。"]};
let all=[];Object.entries(G).forEach(([c,a])=>a.forEach(([t,d])=>all.push({c,t,d})));let sel=all.find(x=>N[x.t])||all[0];function renderNav(q=''){let b=document.getElementById('nav');b.innerHTML='';Object.entries(G).forEach(([c,a])=>{let s=a.filter(([t,d])=>(c+t+d).toLowerCase().includes(q.toLowerCase()));if(!s.length)return;b.insertAdjacentHTML('beforeend',`<div class="group">${c}</div>`);s.forEach(([t,d])=>{let x=all.find(i=>i.t===t),e=document.createElement('button');e.className='nav '+(N[t]?'done ':'')+(sel.t===t?'active':'');e.innerHTML=`<i class="dot"></i><span>${t}</span><span class="diff">${d}</span>`;e.onclick=()=>{sel=x;render();renderNav(document.getElementById('search').value)};b.appendChild(e)})});document.getElementById('progress').textContent=`已整理 ${Object.keys(N).length} / ${all.length} 题`}function render(){let x=sel,n=N[x.t],p=P[x.t];document.getElementById('content').innerHTML=n?`<article class="card"><div class="title"><h2>${x.t}</h2><span class="tag">${x.c}</span><span class="tag">${x.d}</span></div><h3>题目</h3><div class="problem">${p||'题意待补充。'}</div><h3>我的第一反应 / 卡点</h3><div class="note">${n[0]}</div><h3>核心思想</h3><div class="note key">${n[1]}</div><h3>为什么这样做</h3><div class="empty">${n[2]}</div></article>`:`<article class="card"><div class="title"><h2>${x.t}</h2><span class="tag">${x.c}</span><span class="tag">${x.d}</span></div><h3>学习状态</h3><div class="empty">○ 尚未整理。等我们真正聊到这道题后，再补充题意、你的第一思路、卡点和最终理解。</div></article>`}document.getElementById('search').oninput=e=>renderNav(e.target.value);render();renderNav();</script></body></html>
