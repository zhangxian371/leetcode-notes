<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeetCode Hot 100 学习笔记</title><style>:root{--bg:#f6f7fb;--panel:#fff;--text:#20242c;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--soft:#eef2ff;--ok:#eaf7ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}.side{background:#171923;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:800}.sub,.progress{font-size:13px;color:#aeb4c0;margin:6px 0 16px}.search{width:100%;border:0;border-radius:10px;padding:10px 12px;background:#282c39;color:#fff}.group{font-size:12px;color:#8f96a3;margin:18px 8px 7px}.nav{display:flex;width:100%;gap:7px;align-items:center;text-align:left;border:0;background:transparent;color:#d9dde5;padding:8px 9px;border-radius:8px;cursor:pointer}.nav:hover,.nav.active{background:#303546}.dot{width:7px;height:7px;border-radius:50%;background:#555c6d;flex:none}.done .dot{background:#55b879}.num{color:#9299a8;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}.diff{margin-left:auto;font-size:11px;color:#8f96a3}.main{padding:34px;max-width:1050px;width:100%;margin:auto}.hero h1{margin:0;font-size:31px}.hero p{color:var(--muted);line-height:1.7}.mindset{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}.mindset h3{margin:0 0 10px;font-size:15px}.mindset p{margin:8px 0;line-height:1.75}.mindset strong{color:var(--accent)}.card{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px}.title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.title .problem-no{color:var(--accent);font-weight:800}.tag{font-size:12px;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--accent)}.problem-link{display:inline-block;margin-top:16px;padding:9px 13px;border-radius:9px;background:#171923;color:#fff;text-decoration:none;font-size:13px;font-weight:600}.problem-link:hover{opacity:.86}h2{margin:0}h3{font-size:15px;margin:24px 0 8px}.note{background:#fafafa;border-left:4px solid #c7cad1;padding:12px 14px;border-radius:7px;line-height:1.8}.key{background:var(--ok);border-left-color:#42a66b}.empty{color:var(--muted);line-height:1.8}.mobilebar,.overlay,.side-close{display:none}@media(max-width:760px){body.drawer-open{overflow:hidden}.app{display:block;min-height:100vh}.mobilebar{display:flex;position:sticky;top:0;z-index:40;height:56px;padding:0 14px;align-items:center;justify-content:space-between;background:#171923;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.08)}.mobile-title{font-size:16px;font-weight:800}.menu-btn,.side-close{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#303546;color:#fff;min-width:42px;height:36px;padding:0 12px;font-size:14px}.side{position:fixed;z-index:60;top:0;left:0;width:min(86vw,340px);height:100dvh;padding:18px 16px;transform:translateX(-102%);transition:transform .22s ease;box-shadow:12px 0 28px rgba(0,0,0,.22)}.side.open{transform:translateX(0)}.side-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.overlay{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.45)}.overlay.show{display:block}.main{padding:18px 15px 28px;max-width:100%}.hero h1{font-size:25px;line-height:1.25}.hero p{font-size:14px;margin-bottom:0}.mindset{padding:15px 16px;border-radius:12px}.mindset p{font-size:14px;line-height:1.65}.card{margin-top:16px;padding:17px 16px;border-radius:13px}.title{gap:7px}.title h2{font-size:21px}.note,.empty{font-size:14px}.problem-link{width:100%;text-align:center;padding:10px 12px}.nav{padding:10px 9px;min-height:42px}.search{font-size:16px}}</style></head><body><header class="mobilebar"><div class="mobile-title">LeetCode Hot 100</div><button id="menuBtn" class="menu-btn" type="button">目录</button></header><div id="overlay" class="overlay"></div><div class="app"><aside id="side" class="side"><div class="side-head"><div><div class="brand">LeetCode Hot 100</div><div class="sub">我的 100 题学习笔记</div></div><button id="sideClose" class="side-close" type="button" aria-label="关闭目录">关闭</button></div><input id="search" class="search" placeholder="搜索题号 / 题目 / 分类…"><div id="progress" class="progress"></div><div id="nav"></div></aside><main class="main"><div class="hero"><h1>LeetCode Hot 100 学习笔记</h1><p>目录固定为 Hot 100。记录「我的第一反应 → 卡在哪里 → 核心思想 → 为什么正确」。</p><section class="mindset"><h3>算法思维备忘 · DP</h3><p><strong>①</strong> 如果我是人在从左往右处理，我处理到当前元素时，最少需要记住前面什么信息，才能继续做决定？</p><p><strong>②</strong> 哪些历史值得继续带着，哪些历史已经没有信息价值。</p></section></div><div id="content"></div></main></div><script>
const G={"哈希":[[1,"两数之和","简单"],[49,"字母异位词分组","中等"],[128,"最长连续序列","中等"]],"双指针":[[283,"移动零","简单"],[11,"盛最多水的容器","中等"],[15,"三数之和","中等"],[42,"接雨水","困难"]],"滑动窗口":[[3,"无重复字符的最长子串","中等"],[438,"找到字符串中所有字母异位词","中等"]],"子串":[[560,"和为 K 的子数组","中等"],[239,"滑动窗口最大值","困难"],[76,"最小覆盖子串","困难"]],"普通数组":[[53,"最大子数组和","中等"],[56,"合并区间","中等"],[189,"轮转数组","中等"],[238,"除了自身以外数组的乘积","中等"],[41,"缺失的第一个正数","困难"]],"矩阵":[[73,"矩阵置零","中等"],[54,"螺旋矩阵","中等"],[48,"旋转图像","中等"],[240,"搜索二维矩阵 II","中等"]],"链表":[[160,"相交链表","简单"],[206,"反转链表","简单"],[234,"回文链表","简单"],[141,"环形链表","简单"],[142,"环形链表 II","中等"],[21,"合并两个有序链表","简单"],[2,"两数相加","中等"],[19,"删除链表的倒数第 N 个结点","中等"],[24,"两两交换链表中的节点","中等"],[25,"K 个一组翻转链表","困难"],[138,"随机链表的复制","中等"],[148,"排序链表","中等"],[23,"合并 K 个升序链表","困难"],[146,"LRU 缓存","中等"]],"二叉树":[[94,"二叉树的中序遍历","简单"],[104,"二叉树的最大深度","简单"],[226,"翻转二叉树","简单"],[101,"对称二叉树","简单"],[543,"二叉树的直径","简单"],[102,"二叉树的层序遍历","中等"],[108,"将有序数组转换为二叉搜索树","简单"],[98,"验证二叉搜索树","中等"],[230,"二叉搜索树中第 K 小的元素","中等"],[199,"二叉树的右视图","中等"],[114,"二叉树展开为链表","中等"],[105,"从前序与中序遍历序列构造二叉树","中等"],[437,"路径总和 III","中等"],[236,"二叉树的最近公共祖先","中等"],[124,"二叉树中的最大路径和","困难"]],"图论":[[200,"岛屿数量","中等"],[994,"腐烂的橘子","中等"],[207,"课程表","中等"],[208,"实现 Trie (前缀树)","中等"]],"回溯":[[46,"全排列","中等"],[78,"子集","中等"],[17,"电话号码的字母组合","中等"],[39,"组合总和","中等"],[22,"括号生成","中等"],[79,"单词搜索","中等"],[131,"分割回文串","中等"],[51,"N 皇后","困难"]],"二分查找":[[35,"搜索插入位置","简单"],[74,"搜索二维矩阵","中等"],[34,"在排序数组中查找元素的第一个和最后一个位置","中等"],[33,"搜索旋转排序数组","中等"],[153,"寻找旋转排序数组中的最小值","中等"],[4,"寻找两个正序数组的中位数","困难"]],"栈":[[20,"有效的括号","简单"],[155,"最小栈","中等"],[394,"字符串解码","中等"],[739,"每日温度","中等"],[84,"柱状图中最大的矩形","困难"]],"堆":[[215,"数组中的第K个最大元素","中等"],[347,"前 K 个高频元素","中等"],[295,"数据流的中位数","困难"]],"贪心算法":[[121,"买卖股票的最佳时机","简单"],[55,"跳跃游戏","中等"],[45,"跳跃游戏 II","中等"],[763,"划分字母区间","中等"]],"动态规划":[[70,"爬楼梯","简单"],[118,"杨辉三角","简单"],[198,"打家劫舍","中等"],[279,"完全平方数","中等"],[322,"零钱兑换","中等"],[139,"单词拆分","中等"],[300,"最长递增子序列","中等"],[152,"乘积最大子数组","中等"],[416,"分割等和子集","中等"],[32,"最长有效括号","困难"]],"多维动态规划":[[62,"不同路径","中等"],[64,"最小路径和","中等"],[5,"最长回文子串","中等"],[1143,"最长公共子序列","中等"],[72,"编辑距离","中等"]],"技巧":[[136,"只出现一次的数字","简单"],[169,"多数元素","简单"],[75,"颜色分类","中等"],[31,"下一个排列","中等"],[287,"寻找重复数","中等"]]};
const L={"两数之和":"two-sum","字母异位词分组":"group-anagrams","最长连续序列":"longest-consecutive-sequence","移动零":"move-zeroes","盛最多水的容器":"container-with-most-water","三数之和":"3sum","接雨水":"trapping-rain-water","无重复字符的最长子串":"longest-substring-without-repeating-characters","找到字符串中所有字母异位词":"find-all-anagrams-in-a-string","和为 K 的子数组":"subarray-sum-equals-k","滑动窗口最大值":"sliding-window-maximum","最小覆盖子串":"minimum-window-substring","最大子数组和":"maximum-subarray","合并区间":"merge-intervals","轮转数组":"rotate-array","除了自身以外数组的乘积":"product-of-array-except-self","缺失的第一个正数":"first-missing-positive","矩阵置零":"set-matrix-zeroes","螺旋矩阵":"spiral-matrix","旋转图像":"rotate-image"};
const N={"移动零":["双指针推进，把非零元素向前集中。","维护一个位置，表示下一个非零元素应该放在哪里。","一个指针扫描，一个指针维护有效区间边界，O(n)/O(1)。"],"字母异位词分组":["最初考虑排序、两两比较，后来转向哈希表。","为字符串计算统一 key，再做 key → 字符串组。","不要问它和谁一样，而是直接计算它属于哪个桶。"],"最长连续序列":["关注怎样做到 O(n)。","只从 x-1 不存在的起点开始向后扩展。","避免从每个数字重复扩展。"],"盛最多水的容器":["从暴力进入双指针，重点追问为什么移动短边。","面积受短边限制，所以移动短边。","不是保证下一步更优，而是证明能排除不可能成为最优解的组合。"],"三数之和":["先想排序后二分，后来改成固定一个数加左右双指针。","固定 nums[i]，在右侧找两数之和等于 -nums[i]。","排序提供单调性，同时注意三层去重。"],"接雨水":["先理解逐列计算，再理解双指针。","水量由左右最高墙较矮者决定。","哪侧最高墙更低，哪侧当前水量就已经可以确定。"],"找到字符串中所有字母异位词":["用两个频次表维护目标和窗口。","固定长度滑动窗口：右进一个、左出一个。","字符集已知时固定数组比哈希表更直接。"],"和为 K 的子数组":["一开始感觉像滑动窗口，随后转向前缀和。","当前前缀和 sum 时，历史 sum-k 的出现次数就是新增答案数。","负数破坏窗口和的单调性，所以普通滑动窗口不适用。"],"滑动窗口最大值":["重点理解为什么需要单调队列。","队列保存仍可能成为最大值的下标，并保持值递减。","新元素比旧元素更大且更新时，旧的小元素可以永久淘汰。"],"最小覆盖子串":["概括成像蚯蚓移动：右边扩张，满足后缩左边。","右扩到满足，左边在仍满足时尽可能收缩。","每个字符至多进出窗口一次。"],"最大子数组和":["最难的是为什么按“以当前位置结束”划分。","cur=必须以 i 结尾的最大和：max(nums[i],cur+nums[i])。","这是人为设计的 DP 状态，使当前只依赖前一步；负历史贡献应丢弃。"],"搜索二维矩阵 II":["从右上角出发，按大小向左或向下。","右上角向左变小、向下变大。","每一步排除一行或一列，O(m+n)。"]};
let all=[];Object.entries(G).forEach(([c,a])=>a.forEach(([no,t,d])=>all.push({c,no,t,d})));let sel=all.find(x=>N[x.t])||all[0];function renderNav(q=''){let b=document.getElementById('nav');b.innerHTML='';Object.entries(G).forEach(([c,a])=>{let s=a.filter(([no,t,d])=>(c+no+t+d).toLowerCase().includes(q.toLowerCase()));if(!s.length)return;b.insertAdjacentHTML('beforeend',`<div class="group">${c}</div>`);s.forEach(([no,t,d])=>{let x=all.find(i=>i.no===no),e=document.createElement('button');e.className='nav '+(N[t]?'done ':'')+(sel.no===no?'active':'');e.innerHTML=`<i class="dot"></i><span class="num">${no}.</span><span>${t}</span><span class="diff">${d}</span>`;e.onclick=()=>{sel=x;render();renderNav(document.getElementById('search').value);if(window.innerWidth<=760)closeDrawer()};b.appendChild(e)})});document.getElementById('progress').textContent=`已整理 ${Object.keys(N).length} / ${all.length} 题`}function render(){let x=sel,n=N[x.t],link=L[x.t]?`<a class="problem-link" href="https://leetcode.cn/problems/${L[x.t]}/" target="_blank" rel="noopener">在 LeetCode 查看原题 ↗</a>`:'';document.getElementById('content').innerHTML=n?`<article class="card"><div class="title"><span class="problem-no">${x.no}.</span><h2>${x.t}</h2><span class="tag">${x.c}</span><span class="tag">${x.d}</span></div>${link}<h3>我的第一反应 / 卡点</h3><div class="note">${n[0]}</div><h3>核心思想</h3><div class="note key">${n[1]}</div><h3>为什么这样做</h3><div class="empty">${n[2]}</div></article>`:`<article class="card"><div class="title"><span class="problem-no">${x.no}.</span><h2>${x.t}</h2><span class="tag">${x.c}</span><span class="tag">${x.d}</span></div>${link}<h3>学习状态</h3><div class="empty">○ 尚未整理。等我们真正聊到这道题后，再记录你的第一思路、卡点和最终理解。</div></article>`}function openDrawer(){document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('show');document.body.classList.add('drawer-open')}function closeDrawer(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show');document.body.classList.remove('drawer-open')}document.getElementById('menuBtn').onclick=openDrawer;document.getElementById('sideClose').onclick=closeDrawer;document.getElementById('overlay').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.getElementById('search').oninput=e=>renderNav(e.target.value);render();renderNav();</script></body></html>
