<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeetCode 刷题笔记</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#20242c;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--soft:#eef2ff;--ok:#eaf7ef}
*{box-sizing:border-box} body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}.side{background:#171923;color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:21px;font-weight:800;margin-bottom:5px}.sub{font-size:13px;color:#aeb4c0;margin-bottom:20px}.search{width:100%;border:0;border-radius:10px;padding:10px 12px;margin-bottom:16px;background:#282c39;color:#fff;outline:none}.group{font-size:12px;color:#8f96a3;text-transform:uppercase;margin:17px 8px 8px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d9dde5;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:#303546;color:#fff}.main{padding:34px;max-width:1100px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.hero h1{margin:0;font-size:32px}.hero p{color:var(--muted);margin:7px 0 0}.count{font-size:13px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 3px 14px rgba(0,0,0,.035)}.title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.num{font-weight:800;color:var(--accent)}.tag{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}h2{margin:0;font-size:25px}h3{font-size:15px;margin:24px 0 8px}.note{background:#fafafa;border-left:4px solid #c7cad1;padding:12px 14px;border-radius:7px;line-height:1.75}.key{background:var(--ok);border-left-color:#42a66b}.explain{line-height:1.8;color:#343942}.code{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:15px;border-radius:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;overflow:auto}.footer{margin-top:24px;color:var(--muted);font-size:13px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.main{padding:20px}.hero{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">LeetCode Notebook</div><div class="sub">你的刷题思路与讲解笔记</div><input id="search" class="search" placeholder="搜索题号 / 题名 / 关键词…"><div id="nav"></div></aside><main class="main"><div class="hero"><div><h1>刷题笔记</h1><p>重点不是背代码，而是记录「我当时怎么想 → 卡在哪里 → 为什么正确」。</p></div><div class="count" id="count"></div></div><div id="content"></div></main></div>
<script>
const notes=[
{n:283,t:'移动零',cat:'双指针',mine:'用双指针推进，把非零元素向前集中；也讨论过用 swap 处理。',key:'核心是不需要真的“寻找 0”，而是维护一个位置，表示下一个非零元素应该放在哪里。',why:'这是典型的原地数组整理：一个指针扫描，一个指针表示有效区间边界。时间 O(n)，额外空间 O(1)。'},
{n:49,t:'字母异位词分组',cat:'哈希表',mine:'最初想到字符编号/排序，再两两比较并记录是否已经分组。后来进一步看哈希表写法。',key:'把每个字符串转换成一个“同组字符串一定相同”的 key，例如排序后的字符串，或 26 个字母的计数。然后 key → 一组字符串。',why:'两两比较会接近 O(n²)。哈希表的关键思想是：不要问“它和谁一样”，而是直接算出“它属于哪个桶”。'},
{n:128,t:'最长连续序列',cat:'哈希表',mine:'关注怎样做到 O(n)，而不是排序后扫描。',key:'只从连续序列的起点开始扩展：当 x-1 不在集合里时，x 才是起点。',why:'如果每个数字都向后扩展会重复劳动。只从起点扩展后，每个元素整体只会被有效访问有限次，因此可做到期望 O(n)。'},
{n:11,t:'盛最多水的容器',cat:'双指针',mine:'从暴力法进入双指针，对“为什么移动短边不会漏掉最优解”反复确认。',key:'左右指针夹住容器，面积由较短边限制。移动长边只会让宽度变小，而短边仍限制高度，所以不可能改善当前由短边限制的候选；因此排除短边这一侧。',why:'双指针的本质不是“下一步面积一定更大”，而是每一步都能证明排除一批不可能成为最优解的组合。等高时两边都可内收。'},
{n:15,t:'三数之和',cat:'排序 + 双指针',mine:'先考虑排序后二分查找，后来改成固定一个数，再用左右双指针寻找另外两个数。',key:'排序后固定 nums[i]，问题变成在右侧区间找两数之和 = -nums[i]。和太小 left++，太大 right--。',why:'排序带来了单调性，因此一次左右移动就能排除一批候选。真正容易错的是去重：i 要去重，找到答案后 left/right 也要跨过重复值。'},
{n:42,t:'接雨水',cat:'双指针',mine:'先理解“每一列能接多少水”，之后对双指针版本一度没看懂。',key:'某一列水量 = min(左侧最高墙, 右侧最高墙) - 当前高度。双指针维护 leftMax/rightMax，哪一侧的最高墙更低，就能确定哪一侧当前格子的水量。',why:'决定水位的是较矮的那堵最高墙。另一侧即使以后出现更高墙，也不会改变当前较矮侧的上限，所以可以当场结算。'},
{n:438,t:'找到字符串中所有字母异位词',cat:'滑动窗口',mine:'想到用两个 unordered_map 统计窗口和目标串；还讨论了是否需要 set，以及 vector<int> count(256, 0) 中第二个参数的意义。',key:'窗口长度固定为 p.length()。右边进一个字符，左边出一个字符，维护窗口字符频次，并判断是否与目标频次一致。',why:'固定长度窗口不需要反复从头统计。若字符集已知（如小写字母），固定数组通常比 unordered_map 更直接、更快。vector<int>(256,0) 表示创建 256 个 int，并全部初始化为 0。'},
{n:560,t:'和为 K 的子数组',cat:'前缀和 + 哈希表',mine:'一开始感觉“好像还是滑动窗口，而且更明显”，随后追问哈希表怎么写。',key:'它不是普通滑动窗口，因为数组允许负数，窗口和没有单调性。设当前前缀和为 sum，只要以前出现过 sum-k，就存在一个以当前位置结尾、和为 k 的子数组。',why:'哈希表保存「某个前缀和出现过多少次」。每到一个位置：答案 += count[sum-k]，再 count[sum]++。初始化 count[0]=1，用于覆盖从下标 0 开始的子数组。'},
{n:239,t:'滑动窗口最大值',cat:'单调队列',mine:'在连续学习滑动窗口题时进入这题，重点是理解为什么普通容器不够。',key:'用双端队列保存“仍可能成为最大值”的下标，并让对应值从队头到队尾单调递减。队头永远是当前窗口最大值。',why:'新元素进入时，比它小且更早的元素以后永远不可能成为最大值，可以直接从队尾淘汰；过期下标从队头移除。整体 O(n)。'},
{n:76,t:'最小覆盖子串',cat:'滑动窗口',mine:'最初提出两个指针：左边界找 t 中字符，右边界继续寻找能包含 t 的范围。后来概括成“像蚯蚓一样移动”：右边扩张，满足后再缩左边。',key:'右指针负责把窗口扩到“满足条件”，左指针负责在仍满足条件时尽可能收缩；收缩到不能再缩后，再继续右扩。',why:'关键不是枚举所有左右边界，而是利用窗口状态：每个字符最多被右指针加入一次、被左指针移出一次，因此可以把暴力枚举降到线性级别。'},
{n:53,t:'最大子数组和',cat:'动态规划 / Kadane',mine:'提示后仍很难自己蹦出思路，尤其觉得“为什么一定要按照以当前位置结束去划分”很怪，并借此开始理解动态规划。',key:'定义 cur = “必须以当前位置 i 结尾的最大子数组和”。那么只有两种选择：自己重新开始 nums[i]，或接在前一个最优结尾后面 cur+nums[i]。即 cur=max(nums[i],cur+nums[i])。',why:'“以哪里结束”不是题目强制的，而是我们人为选择的状态定义。这个定义恰好让大问题只依赖前一步：以前的累计和若为正就值得带上，为负就应该丢掉。全局答案再取所有 cur 的最大值。'},
{n:240,t:'搜索二维矩阵 II',cat:'单调性',mine:'使用右上角作为起点，根据当前值与 target 的大小决定向左或向下。',key:'右上角同时具有两个方向的单调性：向左变小，向下变大。',why:'当前值大于 target 时整列下方无需考虑当前列右侧关系，向左；小于 target 时当前行左侧都更小，向下。每步排除一行或一列，O(m+n)。'},
{n:'?',t:'知道秘密的人数',cat:'状态抽象',mine:'曾尝试把人群抽象成三类，再转入讲解。',key:'这类题首先要把“每天的人处于什么状态、什么时候开始传播、什么时候遗忘”定义清楚，再做按天转移。',why:'难点通常不在代码，而在状态边界：哪些人今天能传播，哪些人今天刚知道，哪些人今天失效。状态定义清楚后再考虑 DP/差分优化。'}
];
let selected=notes[0];
function renderNav(q=''){const box=document.getElementById('nav');box.innerHTML='';const filtered=notes.filter(x=>(`${x.n} ${x.t} ${x.cat} ${x.mine} ${x.key}`).toLowerCase().includes(q.toLowerCase()));const groups={};filtered.forEach(x=>(groups[x.cat]??=[]).push(x));Object.entries(groups).forEach(([g,arr])=>{box.insertAdjacentHTML('beforeend',`<div class="group">${g}</div>`);arr.forEach(x=>{const b=document.createElement('button');b.className='nav'+(selected===x?' active':'');b.textContent=`${x.n}. ${x.t}`;b.onclick=()=>{selected=x;render();renderNav(document.getElementById('search').value)};box.appendChild(b)})});document.getElementById('count').textContent=`已整理 ${filtered.length} / ${notes.length} 题`}
function render(){const x=selected;document.getElementById('content').innerHTML=`<article class="card"><div class="title"><span class="num">#${x.n}</span><h2>${x.t}</h2><span class="tag">${x.cat}</span></div><h3>你当时的思路 / 卡点</h3><div class="note">${x.mine}</div><h3>核心解法</h3><div class="note key">${x.key}</div><h3>为什么这样做</h3><div class="explain">${x.why}</div><div class="footer">这份页面适合继续追加：题目 → 你的第一反应 → 卡点 → 核心思想 → 正确性解释 → 最终代码。</div></article>`}
document.getElementById('search').addEventListener('input',e=>renderNav(e.target.value));render();renderNav();
</script></body></html>
